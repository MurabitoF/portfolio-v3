      kind: Caso de estudio · Epidata
      summary: La integración de recetas de un sistema de ventas para farmacias hecho desde cero, con ventas, stock, obras sociales y facturación.
      stages:
        - { label: Requerimiento, text: 'Obtener las recetas electrónicas de cada obra social, cada una con su propia forma de exponerlas.' }
        - { label: Decisión, text: 'Un patrón Strategy: una interfaz de recetas y una implementación por obra social, así sumar una obra social nunca toca el flujo de ventas.' }
        - { label: Resultado, text: 'Integración entregada, con front y back. Me fui antes de que el sistema saliera a producción.' }
      facts:
