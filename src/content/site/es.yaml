      kind: Proyecto principal, en desarrollo
      summary: Un constructor visual de páginas web, de punta a punta.
      stages:
        - { label: Requerimiento, text: 'Armar páginas web sin escribir código, arrastrando y ordenando componentes.' }
        - { label: Decisión, text: 'Monolito modular en Spring Boot con un worker asíncrono sobre RabbitMQ, en lugar de microservicios.' }
        - { label: Resultado, text: 'En desarrollo.' }
      facts:
