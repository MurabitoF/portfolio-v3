    - title: Portal de prestadores
      kind: Caso de estudio · AyiGroup
      summary: Un producto satélite de la plataforma de Colonia Suiza, desarrollado prácticamente solo.
      stages:
        - { label: Requerimiento, text: 'Que los prestadores administren sus turnos y preliquiden los que realizaron.' }
        - { label: Decisión, text: 'El portal en NestJS como funciones de AWS Lambda; las integraciones en Java y Spring Boot, el lenguaje del sistema principal, para integrarlas con la menor fricción.' }
        - { label: Resultado, text: 'En producción, integrado con el sistema principal de Colonia Suiza y con facturación. Sigue evolucionando con cambios esporádicos.' }
      facts:
