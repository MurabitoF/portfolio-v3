experience:
  heading: Experiencia
  items:
    - company: AyiGroup
      role: Desarrollador Fullstack
      period: jul. 2024 – actualidad
      summary: Nuevas funcionalidades para las plataformas de Colonia Suiza y sus productos satélite, para un cliente del sector ART.
      highlights:
        - Desarrollé prácticamente solo un producto satélite donde los prestadores administran sus turnos y preliquidan los que realizaron, integrado con el sistema principal de Colonia Suiza y con facturación.
        - Estuve mucho tiempo en el soporte de las apps del cliente y resolví buena parte de sus bugs; hoy el equipo me consulta cuando aparece un problema difícil.
      stack: [React, TypeScript, Java, Spring Boot, Node.js, NestJS, AWS Lambda, MySQL]
    - company: Epidata
      role: Desarrollador Fullstack
      period: nov. 2022 – jul. 2024
      summary: "Desarrollo fullstack para clientes de salud: farmacias y los centros médicos de Galeno."
      highlights:
        - Hice la integración de recetas electrónicas con las obras sociales para un nuevo sistema de ventas de farmacias, con ventas, stock, obras sociales y facturación.
        - Trabajé en el restyling y la modernización de la app que usan a diario los centros médicos de Galeno, además de bugs y optimizaciones.
      stack: [React, TypeScript, Node.js, NestJS, Java, Spring Boot]
