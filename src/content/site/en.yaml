work:
  heading: Projects
  featured:
    - title: Precios Super
      kind: Personal project
      summary: Tracks Argentine supermarket prices from the public Precios Claros dataset, with historical series, a public API and a per-product inflation dashboard.
      image: { src: /work/precios-super.webp, alt: 'Precios Super dashboard: weekly and cumulative change of the basket, a week-by-week chart and per-product detail.', width: 1600, height: 750 }
      stages:
        - { label: Requirement, text: 'Precios Claros publishes the prices of every supermarket in the country, but overwrites each file after 7 days: without an archive of its own there is no history.' }
        - { label: Decision, text: 'Store each Wednesday''s ZIP in S3 and reduce 14.3 million rows to the median per product, chain and week, about 240 thousand. The API runs Spring Boot on AWS Lambda with SnapStart, which cuts the cold start from eleven seconds to one.' }
        - { label: Outcome, text: 'In production: weekly archive, public API and dashboard. The basket index uses the Jevons method, the same one Argentina''s official CPI uses.' }
      facts:
        - { label: Stack, value: 'Java, Spring Boot, AWS Lambda, S3, CloudFront, Turso, React, TypeScript, GitHub Actions' }
        - { label: Period, value: Nov 2026 – present }
      demo: 'https://d1qcidvnny7mze.cloudfront.net'
      code: 'https://github.com/MurabitoF/precios-super'
    - title: Provider portal
      kind: Case study · AyiGroup
      summary: A satellite product of the Colonia Suiza platform, which I built end to end.
      stages:
        - { label: Requirement, text: 'Let providers manage their appointments and pre-settle the ones they performed.' }
        - { label: Decision, text: 'The portal on NestJS as AWS Lambda functions; the integrations in Java and Spring Boot, the main system''s own language, so they plug in with the least friction.' }
        - { label: Outcome, text: 'In production, integrated with the main Colonia Suiza system and with invoicing. Still evolving with occasional changes.' }
      facts:
        - { label: Industry, value: Workers' compensation insurance }
        - { label: Role, value: Main fullstack developer }
        - { label: Stack, value: 'React, NestJS on AWS Lambda, Java, Spring Boot, MySQL on AWS' }
        - { label: Period, value: 'Sep 2025 – Mar 2026, maintained since' }
    - title: Electronic prescriptions
      kind: Case study · Epidata
      summary: The prescription integration of a pharmacy sales system built from scratch, which covered sales, stock, health insurers and invoicing.
      stages:
        - { label: Requirement, text: 'Pull electronic prescriptions from each health insurer, each with its own way of exposing them.' }
        - { label: Decision, text: 'A Strategy pattern: one prescription interface and one implementation per insurer, so adding an insurer never touches the sales flow.' }
        - { label: Outcome, text: 'Integration delivered with frontend and backend. I left before the system went live.' }
      facts:
        - { label: Industry, value: 'Healthcare, pharmacies' }
        - { label: Role, value: Fullstack developer }
        - { label: Stack, value: 'React, Node.js, microservices, MySQL' }
